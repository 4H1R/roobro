# Deploy the current source tree instead of pulling registry application images.
# Run from /opt/roobro with:
# docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/docker-compose.zoora.yml up -d --build --wait --wait-timeout 180
services:
  frontend:
    image: roobro-frontend:zoora
    pull_policy: never
    build:
      context: .
      dockerfile: frontend/Dockerfile
  api:
    image: roobro-backend:zoora
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
