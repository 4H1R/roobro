name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish alongside the commit SHA
        required: false
        default: ""

concurrency:
  group: build-push
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: roobro-backend
            dockerfile: Dockerfile
          - name: roobro-frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - id: gocache
        if: matrix.name == 'roobro-backend'
        uses: actions/cache@v6
        with:
          path: go-build-cache
          key: go-build-cache-${{ hashFiles('go.sum') }}
          restore-keys: go-build-cache-

      - if: matrix.name == 'roobro-backend'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-build-cache": {
                "target": "/root/.cache/go-build",
                "id": "roobro-gobuild"
              }
            }
          skip-extraction: ${{ steps.gocache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
