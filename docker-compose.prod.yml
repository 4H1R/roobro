x-api-environment: &api-environment
  APP_ENV: production
  PORT: 8080
  FRONTEND_URL: "${FRONTEND_URL:?set FRONTEND_URL in .env.prod}"
  LIVEKIT_HOST: "http://livekit:7880"
  LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL in .env.prod}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env.prod}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env.prod}"

services:
  frontend:
    image: "${REGISTRY:-ghcr.io/4h1r}/roobro-frontend:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null && wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [roobro]

  api:
    image: "${REGISTRY:-ghcr.io/4h1r}/roobro-backend:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *api-environment
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose: ["8080"]
    networks: [roobro]

  livekit:
    image: "${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.6}"
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: "${LIVEKIT_API_SECRET}"
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:8080/api/v1/livekit/webhook
    ports:
      - "${LIVEKIT_SIGNAL_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_SIGNAL_PORT:-7880}:7880"
      - "0.0.0.0:${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}"
      - "0.0.0.0:${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    networks: [roobro]

networks:
  roobro:
    driver: bridge
